name: Multi-database checker
on:
  push:
    branches: [multi-db-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mysql, mariadb, redis]
    env:
      DB_ENGINE: ${{ matrix.engine }}
      COMPOSE_PROJECT_NAME: checker-${{ matrix.engine }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
      - name: Project checks, types, unit tests and production build
        run: |
          pnpm check
          pnpm test
          pnpm build
      - name: Select disposable database URL
        run: |
          case "$DB_ENGINE" in
            postgresql) echo 'TEST_DATABASE_URL=postgresql://probe:fixture-postgres-password@postgresql:5432/probe' >> "$GITHUB_ENV" ;;
            mysql) echo 'TEST_DATABASE_URL=mysql://probe:fixture-mysql-password@mysql:3306/probe' >> "$GITHUB_ENV" ;;
            mariadb) echo 'TEST_DATABASE_URL=mysql://probe:fixture-mariadb-password@mariadb:3306/probe' >> "$GITHUB_ENV" ;;
            redis) echo 'TEST_DATABASE_URL=' >> "$GITHUB_ENV" ;;
          esac
      - name: Build Docker image and start isolated fixtures
        run: docker compose -f compose.test.yaml up --build -d --wait --wait-timeout 240
      - name: Verify real connectivity and failure recovery
        env:
          RUN_DB_INTEGRATION: 'true'
        run: pnpm test:integration
      - name: Sanitized fixture logs
        if: failure()
        run: node scripts/ci-logs.mjs
      - name: Remove disposable fixtures
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans
